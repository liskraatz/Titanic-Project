<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Titanic AI Prediction Model</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">
  </head>

  <header>
    <h1>Titanic Survival Prediction</h1>
  </header>

  <body>
<!--Page 1-->  
    <!--Name-->
    <div class="form-step active">
      <div>
        <div class="text-input">
          <h3 for="name">Enter your Name</h3>
          <input type="text" name="name" id="name-input" placeholder="Name" data-error="Please enter your name to continue."><br>
          <p class="alert"></p><br>
        </div>
        <div>
          <button class="next-button" onclick="navigateForward()">Next</button>
        </div>
      </div>
    </div>

<!--Page 2-->  
    <div class="form-step">
      <div>
        <!--Sex-->
          <h3>Sex</h3>

          <div class="radio-input horizontal">

          <div class="radio">
            <input type="radio" class="sex" name="sex" value="0" id="sex-male" data-error='Please choose an option to continue.' required>
            <label for="sex-male">Male</label>
          </div>

          <div class="radio">
            <input type="radio" class="sex" name="sex" value="1" id="sex-female" data-error='Please choose an option to continue.' required>
            <label for="sex-female">Female</label>
          </div>

          <!-- ORIGINAL:
          <div class="radio">
            <input type="radio" class="sex" name="sex" value="0" id="sex-other" data-error='Please choose an option to continue.' required>
            <label for="sex-other">Other</label>
          </div>
          CHANGED: "Other" was sending value="0", the same as Male, so anyone
          who picked it was silently being recorded/predicted as male.
          Replaced with two real options below instead. -->

          <div class="radio">
            <input type="radio" class="sex" name="sex" value="2" id="sex-nonbinary" data-error='Please choose an option to continue.' required>
            <label for="sex-nonbinary">Non-binary</label>
          </div>

          <div class="radio">
            <input type="radio" class="sex" name="sex" value="3" id="sex-self-describe" data-error='Please choose an option to continue.' required>
            <label for="sex-self-describe">Self-describe</label>
          </div>
          <p class="alert"></p><br>

          <!-- NEW: only shows when "Self-describe" is picked, see JS below -->
          <div id="gender-self-describe-wrap" style="display:none;">
            <input type="text" id="gender-self-describe" maxlength="40" placeholder="How would you describe your gender?" data-error="Please describe your gender, or choose another option above.">
          </div>
        </div>
        

        <!--Title-->
        <div class="select-input">
          <h3>Title</h3>
          <select id="title-input" name="title" data-error='Please choose a title to continue. You can also choose "None".'>
            <option value="0" selected disabled>Please choose a title</option>
            <option value="1">Mr</option>
            <option value="2">Ms</option>
            <option value="3">Mrs</option>
            <option value="4">None</option>
            <option value="5">VIP</option>
            <option value="6">Professional</option>
          </select><br>
          <p class="alert"></p><br>
        </div>

        <div>
          <button class="back-button" onclick="navigateBack()">Back</button>
          <button class="next-button" onclick="navigateForward()">Next</button>
        </div>
      </div>
    </div>

<!--Page 3-->  
    <div class="form-step">
      <div>
        <!--Age-->
        <div class="number-input">
          <h3>Age</h3>
          <input type="number" name="age" id="age-input" placeholder="Age" min="0" max="100" size="3" data-error="Age must be between 0 and 100."><br>
          <p class="alert"></p><br>
        </div>

        <div>
          <button class="back-button" onclick="navigateBack()">Back</button>
          <button class="next-button" onclick="navigateForward()">Next</button>
        </div>
      </div>
    </div>

<!--Page 4-->  
    <div class="form-step">
      <div>
        <!--Travel Comfort-->
        <h3>How would you like to travel?</h3>

        <div class="radio-input vertical">

          <div class="radio">
            <input type="radio" class="travel-comfort" name="class" value="1" data-error='Please choose an option to continue.' required>
            <label for="1">I'd rough it to save money</label><br>
          </div>

          <div class="radio">
            <input type="radio" class="travel-comfort" name="class" value="2" data-error='Please choose an option to continue.' required>
            <label for="2">Comfortable but not extravagant</label><br>
          </div>

          <div class="radio">
            <input type="radio" class="travel-comfort" name="class" value="3" data-error='Please choose an option to continue.' required>
            <label for="2">Nothing but the best</label><br>
          </div>
          <p class="alert"></p><br>
        </div>

        <div class="radio">
          <button class="back-button" onclick="navigateBack()">Back</button>
          <button class="next-button" onclick="navigateForward()">Next</button>
        </div>
      </div>
    </div>

<!--Page 5-->  
    <div class="form-step">
      <div>
      <!--Siblings-->
        <div class="number-input">
          <h3>How many siblings do you have?</h3>

          <input type="number" id="sib-input" name="sib" min="0" max="10" size="3" data-error='If you have none, please enter "0"'><br>
          <p class="alert"></p><br>
        </div>
      <!--Parents-->
      <h3>Are you travelling with your parents?</h3>
        <div class="radio-input horizontal">
          <div class="radio">
            <input type="radio" class="pa-input" name="pa" value="1" data-error='Please choose an option to continue.' required>
            <label for="1">Yes</label>
          </div>

          <div class="radio">
            <input type="radio" class="pa-input" name="pa" value="0" data-error='Please choose an option to continue.' required>
            <label for="0">No</label><br>
          </div>
          <p class="alert"></p><br>
        </div>

        <div class="radio">
          <button class="back-button" onclick="navigateBack()">Back</button>
          <button class="next-button" onclick="navigateForward()">Next</button>
        </div>
      </div>
    </div>

<!--Page 6-->
    <div class="form-step">
      <div>
        <h3>Do you have a spouse or partner?</h3>
          <div class="radio-input horizontal">

          <div class="radio">
            <input type="radio" class="sp-input" name="sp" id="yes-sp" value="1" data-error='Please choose an option to continue.' required>
            <label for="yes-sp">Yes</label>
          </div>

          <div class="radio">
            <input type="radio" class="sp-input" name="sp" id="no-sp" value="0" data-error='Please choose an option to continue.' required>
            <label for="no-sp">No</label>
          </div>
          <p class="alert"></p><br>
        </div>

        <div class="number-input">
          <h3>How many children do you have?</h3>
          <input type="number" name="ch" id="ch-input" min="0" max="20"size="3" data-error='If you have no children, please enter "0"'><br>
          <p class="alert"></p><br><br>
        </div>

        <!--Submit-->
        <div>
          <button class="back-button" onclick="navigateBack()">Back</button>
          <button class="predictSurv" onclick="sendPredictionData()">Predict Survival</button>
        </div>
      </div>
    </div>

    <div id="ocean">
      <svg class="wave" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,60 C150,100 350,20 600,60 C850,100 1050,20 1200,60 L1200,120 L0,120 Z">
        </path>
      </svg>
    </div>

    <script>
      // Form Navigation 
      let currentStep = 0
      let steps = document.querySelectorAll('.form-step');

      function navigateBack(){
        if (currentStep > 0){
          currentStep--;
          showStep(currentStep)
        };
      };

       function navigateForward(){
        // User input validation
        let activePage = steps[currentStep];
        let inputList = activePage.querySelectorAll('input, select');
        let radioGroup = activePage.querySelector('input[type = "radio"]');
        let isValid = true;

        // Validate if textbox is not empty
        for (individualInput of inputList){
          // NEW: skip inputs that aren't currently visible (like the
          // self-describe box when a different sex option is picked) -
          // without this, it always counts as empty and blocks progress
          // with an "undefined" error, even when it doesn't apply
          if (individualInput.offsetParent === null){
            continue;
          }
          let container = individualInput.closest('.select-input, .radio-input, .number-input, .text-input'); // Places error message in correct container
          let alertBox = container.querySelector('.alert')
          if (individualInput.type == 'text'){
            if (individualInput.value == ''){
              isValid = false;
              if (container) {
                    if(alertBox){
                      alertBox.innerText = individualInput.dataset.error;
                    }
                  }
            }
          }
          // Validate if number is within range and not zero
          else if(individualInput.type == 'number'){
            if (individualInput.value === ''){
              isValid = false;
              if (container) {
                    if(alertBox){
                      alertBox.innerText = individualInput.dataset.error;
                    }
                  }
            }else if (individualInput.value != ''){
              userNumber = parseInt(individualInput.value)
              if (userNumber > individualInput.max || userNumber < individualInput.min){
                isValid = false;
                if (container) {
                    if(alertBox){
                      alertBox.innerText = individualInput.dataset.error;
                    }
                  }
              }
            }
          }
          // Validate that a choice from the select menu has been chosen
          else if(individualInput.type == 'select-one'){
             if (individualInput.value == 0){
              isValid = false;
              if (container) {
                    if(alertBox){
                      alertBox.innerText = individualInput.dataset.error;
                    }
                  }
            }
          }
          // Validate that one radio button is checked
          else if (radioGroup != null){
            if (activePage.querySelector('input[type="radio"]:checked') == null){
                  isValid = false;
                
                  if (container) {
                    if(alertBox){
                      alertBox.innerText = individualInput.dataset.error;
                    }
                  }
              }
            }

          if (isValid == false){
            return;
          }
        }

        if (currentStep < (steps.length - 1)){
          currentStep++;
          showStep(currentStep)
        };
      };

    // Simulate pages in form
      function showStep(stepIndex){
        steps.forEach((step, index) => {
          if(index == stepIndex){
            step.classList.add('active');
          } else{
            step.classList.remove('active');
          }
          let oceanHeight = ((13 * stepIndex + 25))
          ocean = document.getElementById("ocean")
          ocean.style.height = oceanHeight + "vh"
      })};


      // NEW: reveals the self-describe text box only when that option is picked
      document.querySelectorAll('.sex').forEach((radio) => {
        radio.addEventListener('change', () => {
          const wrap = document.getElementById('gender-self-describe-wrap');
          wrap.style.display = (radio.value === '3' && radio.checked) ? 'block' : 'none';
        });
      });

      // Get data from user input
      function sendPredictionData(){
        let name = document.getElementById('name-input').value;
        let sex = parseInt(document.querySelector('.sex:checked').value);
        // NEW: reads the self-describe text box, sent to Flask alongside sex
        let genderSelf = document.getElementById('gender-self-describe').value;
        let age = parseInt(document.getElementById('age-input').value) || 0;
        let title = parseInt(document.getElementById('title-input').value);
        let travelComfort = parseInt(document.querySelector('.travel-comfort:checked').value);
        let sib = parseInt(document.getElementById('sib-input').value) || 0;
        let pa = parseInt(document.querySelector('.pa-input:checked').value) || 0;
        let sp = parseInt(document.querySelector('.sp-input:checked').value) || 0;
        let ch = parseInt(document.getElementById('ch-input').value) || 0;


        const passengerData = {
          name: name,
          sex: sex,
          genderSelf: genderSelf, // NEW
          age: age,
          title: title,
          'travel-comfort': travelComfort,
          sib: sib,
          pa: pa,
          sp: sp,
          ch: ch,
        };
        
        // Sending data in background 
        // Fetch = built-in-browser API to make HTTP requests
        fetch('/predict', { // Target URL
          method: 'POST', // Sending data to server
          headers: {
            'Content-Type': 'application/json' // Format so flaks knows how to read
          },
          body: JSON.stringify(passengerData) // Convert to raw text string for transport        
          })
          .then(response => response.json()) //Parsing incoming stream
          .then(data => { // Dictionary from Flask
            console.log("Server says: ", data);
            // ORIGINAL: nothing shown to the user here, only logged to console
            // CHANGED: now actually shows the result - swap this alert() for
            // real results-page markup whenever that's ready
            alert(data.outcome + " (as " + data.gender_label + ")");
          });
      }

    </script>

  </body>

</html>
